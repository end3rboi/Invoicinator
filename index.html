<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f0e8">
<title>Invoicinator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Carlito:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Open+Sans:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f0e8; --surface:#fffdf8; --surface-2:#f7f3ea; --ink:#22262e; --muted:#6e6a60; --line:#e1dbcd; --line-2:#cfc7b4;
  --accent:#8c3b2b; --accent-ink:#fff8f2; --accent-soft:#f4e4dc; --band:#f1f5ec; --warn:#9a6a14;
  --shadow:0 1px 2px rgba(40,30,10,.05),0 4px 14px rgba(40,30,10,.05);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --surface:#1f2226; --surface-2:#262a2f; --ink:#e9e6df; --muted:#9b978e; --line:#30353b; --line-2:#3f454c;
    --accent:#e39a80; --accent-ink:#1b1310; --accent-soft:#3a2722; --band:#232a24; --warn:#e0b45c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --surface:#1f2226; --surface-2:#262a2f; --ink:#e9e6df; --muted:#9b978e; --line:#30353b; --line-2:#3f454c;
  --accent:#e39a80; --accent-ink:#1b1310; --accent-soft:#3a2722; --band:#232a24; --warn:#e0b45c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 0}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.brand{margin-right:auto;padding-bottom:10px}
.brand h1{margin:0;font:400 22px/1 "Special Elite",var(--mono);letter-spacing:.02em}
.brand small{display:block;margin-top:4px;font:12px var(--mono);color:var(--muted)}
.nav{display:flex;gap:2px}
.nav button{border:1px solid transparent;border-bottom:0;background:none;padding:8px 14px 9px;border-radius:8px 8px 0 0;font:500 13px var(--sans);color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;margin-bottom:-1px}
.nav button[aria-current="true"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
.nav .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
@media (max-width:560px){ .nav{width:100%} .nav button{flex:1;justify-content:center;padding:9px 4px 10px} }

/* layout */
main{max-width:1280px;margin:0 auto;padding:18px 16px 120px;display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:28px;align-items:start}
.editor{display:flex;flex-direction:column;gap:12px;min-width:0}
.previewpane{position:sticky;top:84px;min-width:0;max-height:calc(100vh - 170px);overflow:auto;border-radius:12px}
@media (max-width:900px){ main{grid-template-columns:minmax(0,1fr)} .previewpane{display:none} }


/* cards & fields */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 16px;box-shadow:var(--shadow)}
.card h2{font:600 16px var(--sans);margin:0 0 14px}
.sub{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px;padding-top:14px;border-top:1px dashed var(--line-2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.f input,.f select,.f textarea,.inp{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font:16px var(--sans);letter-spacing:0;text-transform:none;color:var(--ink);outline:none}
.f textarea{resize:vertical;min-height:60px}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f input[type=date],.inp[type=date]{min-height:42px}
.rowlabel{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{border:1px solid var(--line-2);background:none;color:var(--muted);font:500 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:99px;cursor:pointer}
.chip.on{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.note{font:12.5px var(--mono);color:var(--warn);margin:0 0 12px}
.link{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.btn2{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font:500 13.5px var(--sans);white-space:nowrap}
.btn2:hover{border-color:var(--accent);color:var(--accent)}

/* dates & pay */
.mode{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-top:14px}
.mode button{flex:1;border:0;background:none;border-radius:7px;padding:8px 6px;font:500 13.5px var(--sans);color:var(--muted);cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.money{display:flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding-left:9px;min-width:0}
.money:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.money span{color:var(--muted);font:14px var(--mono);letter-spacing:0;text-transform:none}
.money input{border:0;background:none;outline:none;padding:9px 8px 9px 4px;width:100%;min-width:0;font:16px var(--mono);color:var(--ink);box-shadow:none!important}
.f .money input{border:0;padding:9px 8px 9px 4px;background:none;border-radius:0}
.daylist{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dayhead,.dr{display:grid;grid-template-columns:minmax(0,1fr) 108px 96px;gap:8px;align-items:center;padding:6px 10px}
.dayhead{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
.dr{border-top:1px solid var(--line)}
.dayhead+.dr{border-top:0}
.dr:nth-child(odd){background:var(--band)}
.dd{font:500 14px var(--mono)}
.dd small{display:block;font:11.5px var(--sans);color:var(--muted);text-decoration:none}
.dr .money input{padding:7px 6px 7px 3px;font-size:15px}
.dr.changed .money:first-of-type{border-color:var(--accent)}
.dr.off .dd{color:var(--muted)}
.dr.off .dd small{color:var(--accent)}
.dr.off .money:last-of-type{opacity:.4}
.daylist+.help{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.del{width:30px;height:30px;border-radius:7px;border:1px solid var(--line-2);background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
.del:hover{color:var(--accent);border-color:var(--accent)}
.empty{padding:18px 10px;text-align:center;color:var(--muted);font-size:13.5px}
.totalline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:16px;padding-top:12px;border-top:1px dashed var(--line-2)}
.totalline span{font:13px var(--mono);color:var(--muted)}
.totalline b{font:600 22px var(--mono)}
.words{font:12.5px var(--sans);color:var(--muted);margin-top:2px;text-align:right}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.cardhead h2{margin:0}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px 10px 14px;font-size:14px}

/* signature */
.sigprev{height:84px;border:1px dashed var(--line-2);border-radius:8px;background:#fff;display:grid;place-items:center;overflow:hidden}
.sigprev img{max-height:70px;max-width:85%}
.sigprev span{color:#9a958a;font:12.5px var(--mono)}
.sigpad{width:100%;height:150px;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none;display:block;margin-top:10px}
.sigbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* import */
.importbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;margin:-4px 0 16px;border:1px dashed var(--line-2);border-radius:10px;background:var(--surface-2);font-size:14px}
.importbar .btn2{display:inline-flex;align-items:center}
.review{border:1px solid var(--line);border-radius:10px;padding:12px;margin:-6px 0 16px;background:var(--bg)}
.review h3{font:600 14px var(--sans);margin:0 0 8px}
.rv{display:grid;grid-template-columns:20px 120px minmax(0,1fr);gap:8px;align-items:start;padding:6px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.rv:first-of-type{border-top:0}
.rv input{margin:2px 0 0;accent-color:var(--accent)}
.rv span{font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.rv em{font-style:normal;overflow-wrap:anywhere}
.rv img{max-height:46px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:6px}
.review .sigbtns .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* history */
.hist{display:flex;flex-direction:column;gap:8px}
.hitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.hitem .meta{flex:1;min-width:0}
.hitem .meta b{display:block;font:500 14px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem .meta span{font:12px var(--mono);color:var(--muted)}

/* action bar */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.actions-in{max-width:1280px;margin:0 auto;display:flex;gap:10px;align-items:center}
.sum{margin-right:auto;min-width:0;font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum b{display:block;font:600 18px var(--mono);color:var(--ink)}
.btn{border:1px solid transparent;border-radius:10px;height:44px;padding:0 16px;font:500 14.5px var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);min-width:110px}
.btn.ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:progress}
.onlymobile{display:none}
@media (max-width:900px){ .onlymobile{display:inline-flex} }
@media (max-width:560px){ .sum{display:none} .actions .btn{flex:1;padding:0 8px;min-width:0} }

.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font:13px var(--sans);opacity:0;pointer-events:none;transition:all .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.act.show{pointer-events:auto}
.toast button{border:0;background:none;color:var(--accent-soft);font:600 13px var(--sans);text-decoration:underline;text-underline-offset:2px;cursor:pointer;margin-left:8px;padding:0}

/* preview */
.paperwrap{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:16px;overflow:hidden}
.paperscale{margin:0 auto}
.paper{transform-origin:top left;width:794px}
.page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.14)}
.page+.page{margin-top:16px}
.page .win{position:absolute;left:0;right:0;overflow:hidden}
.page .shift{position:absolute;left:0;width:794px}
.clip{position:absolute;top:4px;left:34px;width:16px;height:42px;z-index:2;opacity:.8}
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.sheet-h{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.sheet-h b{margin-right:auto;font:600 15px var(--sans)}
.sheet-b{flex:1;overflow:auto;padding:16px 16px 90px}

/* ===== the invoice: a measured copy of the original layout (A4 @ 96dpi) ===== */
.inv{position:relative;width:794px;min-height:1123px;background:#fff;color:#000;font-family:Calibri,Carlito,sans-serif;font-size:16px;line-height:16px}
.inv *{box-sizing:border-box}
.inv .ttl{position:absolute;left:0;width:777px;top:74px;text-align:center;font:700 14.7px/16px Arial,Arimo,sans-serif}
.inv .bx{position:absolute;left:61px;top:92px;width:659px;border:2px solid #000}
.inv .r{position:relative;display:flex;border-top:2px solid #000}
.inv .bx>.r:first-child{border-top:0}
.inv .c{position:relative;min-width:0}
.inv .L1{width:290px;flex:none;border-right:2px solid #000}
.inv .L2{width:486px;flex:none;border-right:2px solid #000}
.inv .L3{width:343px;flex:none;border-right:2px solid #000}
.inv .R{flex:1}
.inv .t{position:absolute;white-space:nowrap}
.inv b{font-weight:700}
.inv .lab{left:48px;font-weight:700}
.inv .mrow{position:relative;border-top:2px solid #000}
.inv .mrow:first-child{border-top:0}
.inv a{color:#0563c1;text-decoration:underline}
.inv table.dt{border-collapse:collapse;font-family:"Segoe UI","Open Sans",sans-serif;font-size:14.7px;line-height:17px}
.inv table.dt td{border:1px solid #000;padding:0 0 0 3px;height:19px;vertical-align:middle;white-space:nowrap}
.inv table.dt td:first-child{width:193px}
.inv table.dt td:last-child{width:261px}
.inv table.dt tr.b td{font-weight:700}
.inv table.dt tr:first-child td{height:18px}
.inv .sigimg{position:absolute;left:44px;top:55px;width:124px;height:50px}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1>Invoicinator</h1><small>Invoice maker</small></div>
    <nav class="nav" aria-label="Sections">
      <button data-view="invoice" aria-current="true">Invoice</button>
      <button data-view="profile">My details <span class="dot" id="profileDot" hidden></span></button>
      <button data-view="history">Past invoices</button>
    </nav>
  </div>
</header>

<main>
  <section class="editor">
    <div id="view-invoice" style="display:flex;flex-direction:column;gap:12px">
      <div class="banner" id="setupBanner" hidden><span id="setupText"></span><button type="button" class="btn2" data-goto="profile">Add</button></div>

      <div class="card">
        <div class="cardhead"><h2>Invoice</h2><button type="button" class="btn2" id="newInvBtn2">New invoice</button></div>
        <div class="grid">
          <label class="f">Invoice no.<input data-k="invoiceNo" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
          <label class="f">Invoice date<input type="date" data-k="invoiceDate"></label>
          <label class="f full">Project name<input data-k="showName" autocomplete="off"></label>
          <label class="f full">Bill to<input data-k="billTo" placeholder="Same as project name" autocomplete="off"></label>
          <label class="f full">Contact person<input data-k="contactPerson" autocomplete="off"></label>
          <label class="f">Your role<input data-k="role"></label>
          <label class="f">Department<input data-k="department"></label>
        </div>
      </div>

      <div class="card">
        <h2>Dates &amp; pay</h2>
        <div class="grid">
          <label class="f">From<input type="date" data-k="startDate"></label>
          <label class="f">To<input type="date" data-k="endDate"></label>
          <label class="f full">Day rate<div class="money"><span>₹</span><input data-k="dayRate" inputmode="decimal" placeholder="0"></div></label>
        </div>
        <div class="mode" role="group" aria-label="Rates">
          <button type="button" data-mode="same">Same rate every day</button>
          <button type="button" data-mode="custom">Edit specific dates</button>
        </div>
        <div id="dayList"></div>
        <div class="totalline"><span id="gdays">0 days</span><b id="gt">₹0</b></div>
        <div class="words" id="gw"></div>
      </div>

      <div class="card">
        <h2>More</h2>
        <div class="grid">
          <label class="f"><span class="rowlabel">Month of service <button type="button" class="chip" data-auto="month">Auto</button></span><input data-k="month"></label>
          <label class="f">Reverse charge
            <select data-k="reverseCharge"><option value=""></option><option>No</option><option>Yes</option></select>
          </label>
        </div>
      </div>
    </div>

    <div class="card" id="view-history" hidden>
      <h2>Past invoices</h2>
      <div class="hist" id="histList"></div>
      <div class="sigbtns" style="margin-top:14px"><button type="button" class="btn2" id="newInvBtn">New invoice</button></div>
    </div>

    <div class="card" id="view-profile" hidden>
      <div class="importbar">
        <span>Fill these in from an old invoice</span>
        <label class="btn2">Choose file<input type="file" id="importFile" accept=".docx,.pdf,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden></label>
      </div>
      <div id="importReview" hidden></div>
      <div class="grid">
        <label class="f full">Name<input data-k="vendorName" autocomplete="name"></label>
        <label class="f full">Address<textarea data-k="address" rows="3" autocomplete="street-address"></textarea></label>
        <label class="f">Email<input type="email" data-k="email" autocomplete="email"></label>
        <label class="f">Contact no.<input inputmode="tel" data-k="phone" autocomplete="tel"></label>
      </div>
      <div class="sub">Tax &amp; bank</div>
      <div class="grid">
        <label class="f">PAN<input data-k="pan" autocapitalize="characters"></label>
        <label class="f">GST reg. no.<input data-k="gstNo" autocapitalize="characters"></label>
        <label class="f">HSN / SAC code<input data-k="hsn" inputmode="numeric"></label>
        <label class="f">Place of supply<input data-k="place"></label>
        <label class="f">IFSC<input data-k="ifsc" autocapitalize="characters"></label>
        <label class="f">Account no.<input data-k="accNo" inputmode="numeric"></label>
        <label class="f full">Account holder<input data-k="accName"></label>
      </div>
      <div class="sub">Signature</div>
      <div id="sigBox"></div>
      <div class="sub">Reset</div>
      <button type="button" class="btn2" id="resetMe">Clear my details</button>
    </div>
  </section>

  <section class="previewpane">
    <div class="paperwrap"><div class="paperscale"><div class="paper"></div></div></div>
  </section>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-h"><b>Preview</b><button type="button" class="btn ghost" id="sheetClose" style="height:38px">Close</button></div>
  <div class="sheet-b"><div class="paperwrap"><div class="paperscale"><div class="paper"></div></div></div></div>
</div>

<div class="actions"><div class="actions-in">
  <div class="sum" id="sum"></div>
  <button class="btn ghost onlymobile" id="pvBtn">Preview</button>
  <button class="btn ghost" id="dlWord">Word</button>
  <button class="btn primary" id="dlPdf">PDF</button>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="exportHost" style="position:fixed;left:-10000px;top:0"></div>
<div id="measureHost" style="position:fixed;left:-20000px;top:0;width:794px"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
"use strict";

const VENDOR_DEFAULTS = CONFIG.vendor;
const VENDOR_KEYS = Object.keys(VENDOR_DEFAULTS);
const CARRY_KEYS = ["department","role","dayRate"];
const K = name => CONFIG.prefix + name;
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const store = {
  get(k, fb){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e){ return fb; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

/* ===== Dates & numbers ===== */
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const p2 = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const todayISO = () => iso(new Date());
const parseISO = s => { if(!s) return null; const [y,m,d] = s.split("-").map(Number); return y && m && d ? {y,m,d} : null; };
const toDate = s => { const t = parseISO(s); return t ? new Date(t.y, t.m-1, t.d) : null; };
const dmyDash = s => { const t = parseISO(s); return t ? `${p2(t.d)}-${p2(t.m)}-${t.y}` : ""; };
const dmySlashShort = s => { const t = parseISO(s); return t ? `${p2(t.d)}/${p2(t.m)}/${String(t.y).slice(2)}` : ""; };
const dayLabel = s => { const d = toDate(s); return d ? d.toLocaleDateString("en-IN", { day:"numeric", month:"short" }) : ""; };
const weekday = s => { const d = toDate(s); return d ? d.toLocaleDateString("en-IN", { weekday:"long" }) : ""; };
const nice = s => { const d = toDate(s); return d ? d.toLocaleDateString("en-IN", { weekday:"short", day:"numeric", month:"short" }) : ""; };
const ord = n => { const v = n % 100; if (v>=11 && v<=13) return n+"th"; return n + ({1:"st",2:"nd",3:"rd"}[n%10] || "th"); };
const num = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.]/g,"")); return isFinite(n) ? n : 0; };
const inr = n => n.toLocaleString("en-IN", {maximumFractionDigits:2});
const plain = n => String(Math.round(n*100)/100);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function rupeesInWords(amount){
  const a = ["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  const t = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
  const two = n => n < 20 ? a[n] : t[Math.floor(n/10)] + (n%10 ? " " + a[n%10] : "");
  const three = n => (n >= 100 ? a[Math.floor(n/100)] + " hundred" + (n%100 ? " " : "") : "") + (n%100 ? two(n%100) : "");
  const words = n => {
    if (n === 0) return "zero";
    const parts = [];
    const crore = Math.floor(n/1e7); n %= 1e7;
    const lakh = Math.floor(n/1e5); n %= 1e5;
    const th = Math.floor(n/1e3); n %= 1e3;
    if (crore) parts.push(words(crore) + " crore");
    if (lakh) parts.push(two(lakh) + " lakh");
    if (th) parts.push(two(th) + " thousand");
    if (n) parts.push(three(n));
    return parts.join(" ");
  };
  const r = Math.floor(amount), p = Math.round((amount - r) * 100);
  let s = words(r) + " rupees";
  if (p) s += " and " + two(p) + " paise";
  s += " only";
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ===== State ===== */
function freshInvoice(){
  return { showName: "", billTo: "", contactPerson: "", invoiceNo: CONFIG.firstInvoiceNo, invoiceDate: todayISO(), startDate: "", endDate: "",
    month: "", monthAuto: true, reverseCharge: "", rateMode: "same", days: [] };
}
let S = Object.assign({}, VENDOR_DEFAULTS, freshInvoice(), store.get(K("vendor"), {}), store.get(K("draft"), {}));
let history = store.get(K("history"), []);
let view = "invoice";
function normaliseDays(list, rate){
  return (Array.isArray(list) ? list : []).map(d => {
    if (d && "base" in d && !("rate" in d)) return { date: d.date || "", rate: (d.base === "" || num(d.base) === num(rate)) ? "" : String(d.base), extra: d.extra || "", off: false, added: false };
    return { date: d.date || "", rate: d.rate ?? "", extra: d.extra ?? "", off: !!d.off, added: !!d.added, showExtra: !!d.showExtra };
  }).filter(d => d.date);
}
S.days = normaliseDays(S.days, S.dayRate);
if (!["same","custom"].includes(S.rateMode)) S.rateMode = S.days.some(d => d.off || num(d.extra) || (d.rate !== "" && num(d.rate) !== num(S.dayRate))) ? "custom" : "same";
function persist(){
  const v = {}; VENDOR_KEYS.forEach(k => v[k] = S[k]); store.set(K("vendor"), v);
  const d = {}; Object.keys(S).forEach(k => { if (!VENDOR_KEYS.includes(k)) d[k] = S[k]; }); store.set(K("draft"), d);
}

/* ===== Days & money =====
   Every day between From and To is a work day. "Same rate" charges the day rate for all of them;
   "Edit specific dates" lets any day have its own rate, overtime, or be left out. */
const custom = () => S.rateMode === "custom";
const isChanged = d => d.rate !== "" && d.rate != null && num(d.rate) !== num(S.dayRate);
const rateOf = d => custom() && d.rate !== "" && d.rate != null ? num(d.rate) : num(S.dayRate);
const extraOf = d => custom() ? num(d.extra) : 0;
const workedDays = () => S.days.filter(d => !(custom() && d.off)).slice().sort((x,y) => x.date.localeCompare(y.date));
const dayTotal = d => rateOf(d) + extraOf(d);
const grandTotal = () => workedDays().reduce((s,d) => s + dayTotal(d), 0);
const chargeText = d => extraOf(d) ? `${plain(rateOf(d))} + ${plain(extraOf(d))}` : plain(rateOf(d));
function syncRange(){
  const a = toDate(S.startDate), b = toDate(S.endDate || S.startDate);
  const keep = Object.fromEntries(S.days.map(d => [d.date, d]));
  const next = [];
  if (a && b && b >= a){
    const n = Math.round((b - a) / 864e5) + 1;
    if (n > 62){ toast("Pick 62 days or fewer"); return; }
    for (let i = 0; i < n; i++){ const t = new Date(a); t.setDate(a.getDate() + i); const k = iso(t); next.push(keep[k] || { date: k, rate: "", extra: "", off: false }); }
  }
  S.days = next;
}
function contractStart(){ if (S.startDate) return S.startDate; const w = workedDays(); return w.length ? w[0].date : ""; }
function contractEnd(){ if (S.endDate) return S.endDate; if (S.startDate) return S.startDate; const w = workedDays(); return w.length ? w[w.length-1].date : ""; }
function autoMonth(){ const t = parseISO(contractStart()) || parseISO(S.invoiceDate); return t ? `${MONTHS[t.m-1].slice(0,3)}’${String(t.y).slice(2)}` : ""; }
function autoDesc(){
  const role = (S.role || "").trim();
  const base = role ? `For services rendered as ${role}` : "For services rendered";
  const w = workedDays(); const s = w.length ? w[0].date : contractStart(), e = w.length ? w[w.length-1].date : contractEnd();
  const a = parseISO(s), b = parseISO(e);
  if (!a) return base;
  if (!b || s === e) return `${base} on ${ord(a.d)} ${MONTHS[a.m-1]} ${a.y}`;
  if (a.y === b.y && a.m === b.m) return `${base} from ${ord(a.d)} to ${ord(b.d)} ${MONTHS[b.m-1]} ${b.y}`;
  if (a.y === b.y) return `${base} from ${ord(a.d)} ${MONTHS[a.m-1]} to ${ord(b.d)} ${MONTHS[b.m-1]} ${b.y}`;
  return `${base} from ${ord(a.d)} ${MONTHS[a.m-1]} ${a.y} to ${ord(b.d)} ${MONTHS[b.m-1]} ${b.y}`;
}
function fileBase(){
  const first = (S.vendorName || "Invoice").trim().split(/\s+/)[0];
  const proj = (S.showName || "Project").trim().replace(/[^\w\- ]+/g,"").replace(/\s+/g,"_");
  const no = String(S.invoiceNo || "").trim().replace(/[^\w-]+/g, "-").replace(/^-+|-+$/g, "");
  return `${first}_${proj}_invoice_${no || "draft"}`;
}

/* ===== Signature =====
   The printed signature is always one picture the same size as the original's, with the underline at the bottom.
   A build may ship with a built-in one; anyone can upload or draw their own (kept on this device only). */
let userSig = store.get(K("sig"), null);
let sigCache = { key: "", src: "" };
function sigSource(){ return userSig ? { src: userSig.src, own: true } : CONFIG.fixedSignature ? { src: CONFIG.fixedSignature.src, own: false, ready: true } : null; }
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function composedSignature(){
  const s = sigSource();
  if (s && s.ready) return s.src;
  const key = s ? s.src.length + ":" + s.src.slice(-40) : "none";
  if (sigCache.key === key) return sigCache.src;
  const W = 494, H = 198, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  if (s){ const img = await loadImg(s.src); const k = Math.min((W - 40) / img.width, 150 / img.height); const w = img.width * k, h = img.height * k; x.drawImage(img, (W - w) / 2, 184 - h, w, h); }
  x.fillStyle = "#000"; x.fillRect(0, 191, W, 3);
  sigCache = { key, src: c.toDataURL("image/png") };
  return sigCache.src;
}
function cleanSignature(img, opts = {}){
  const maxW = 700, sc = Math.min(1, maxW / img.naturalWidth);
  const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d"); x.drawImage(img, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h), p = d.data;
  const hist = new Uint32Array(256); let n = 0;
  for (let i = 0; i < p.length; i += 4){ if (p[i+3] < 10) continue; hist[Math.round((p[i]+p[i+1]+p[i+2])/3)]++; n++; }
  let acc = 0, paper = 255; for (let v = 255; v >= 0; v--){ acc += hist[v]; if (acc >= n * 0.1){ paper = v; break; } }
  const cut = Math.max(60, paper - 45);
  for (let i = 0; i < p.length; i += 4){
    const l = (p[i]+p[i+1]+p[i+2])/3;
    if (p[i+3] < 10 || l >= cut){ p[i+3] = 0; continue; }
    p[i] = 10; p[i+1] = 12; p[i+2] = 20; p[i+3] = Math.min(255, Math.round((cut - l) / cut * 255 * 1.6));
  }
  if (opts.stripLine){                       // a signature taken from an invoice comes with its printed underline
    for (let y = 0; y < h; y++){
      let ink = 0; for (let xx = 0; xx < w; xx++) if (p[(y*w + xx)*4 + 3] > 40) ink++;
      if (ink > w * 0.6) for (let yy = Math.max(0, y - 1); yy <= Math.min(h - 1, y + 1); yy++) for (let xx = 0; xx < w; xx++) p[(yy*w + xx)*4 + 3] = 0;
    }
  }
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) if (p[(y*w + xx)*4 + 3] > 40){ if (xx < minX) minX = xx; if (xx > maxX) maxX = xx; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  if (maxX < 0) return null;
  x.putImageData(d, 0, 0);
  const pad = 4; minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad); maxX = Math.min(w-1, maxX + pad); maxY = Math.min(h-1, maxY + pad);
  const o = document.createElement("canvas"); o.width = maxX - minX + 1; o.height = maxY - minY + 1;
  o.getContext("2d").drawImage(c, minX, minY, o.width, o.height, 0, 0, o.width, o.height);
  return { src: o.toDataURL("image/png"), w: o.width, h: o.height };
}

function renderSigBox(){

  const wipe = () => { x.fillStyle = "#fff"; x.fillRect(0, 0, r.width, r.height); };
  wipe();

  const pt = e => { const b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };

  $("#sigPadClear").onclick = () => { wipe(); inked = false; };

/* ===== Word file: the original document, filled in ===== */
const WNS = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
const XMLNS = "http://www.w3.org/XML/1998/namespace";
const els = (el, name) => Array.from(el.getElementsByTagNameNS(WNS, name));
const kids = (el, name) => Array.from(el.childNodes).filter(n => n.nodeType === 1 && n.namespaceURI === WNS && n.localName === name);

function setRunText(r, text){
  const ts = kids(r, "t"); let t = ts[0];
  if (!t){ t = r.ownerDocument.createElementNS(WNS, "w:t"); r.appendChild(t); }
  ts.slice(1).forEach(x => x.remove());
  t.textContent = text; t.setAttributeNS(XMLNS, "xml:space", "preserve");
}
/* keep the label (text up to the first ":") and any spacing after it; the value replaces the rest */
function plainRun(r){ kids(r, "rPr").forEach(p => kids(p, "spacing").filter(x => parseInt(x.getAttributeNS(WNS, "val") || x.getAttribute("w:val"), 10) > 0).forEach(x => x.remove())); return r; }
function fillPara(p, value, keepLabel){
  // a value that sits inside a link (the email) goes into the link's own text
  const link = keepLabel && els(p, "hyperlink")[0];
  if (link){
    const lr = els(link, "r").filter(r => kids(r, "t").length);
    if (lr.length){ setRunText(lr[0], value); lr.slice(1).forEach(r => r.remove()); return; }
  }
  const runs = els(p, "r").filter(r => kids(r, "t").length);
  const full = runs.map(textOf).join("");
  const labelLen = keepLabel ? full.indexOf(":") + 1 : 0;
  let acc = 0, placed = false, lastKept = null;
  for (const r of runs){
    const t = textOf(r);
    if (t.length && acc + t.length <= labelLen){ acc += t.length; lastKept = r; continue; }
    if (acc < labelLen){                       // one run holds both label and value: split it
      const cut = labelLen - acc; acc += t.length;
      const rest = t.slice(cut); setRunText(r, t.slice(0, cut));
      const nr = plainRun(r.cloneNode(true)); els(nr, "b").forEach(b => b.remove());
      setRunText(nr, (rest.match(/^\s*/) || [""])[0] + value); r.parentNode.insertBefore(nr, r.nextSibling); placed = true; continue;
    }
    acc += t.length;
    if (placed){ r.remove(); continue; }
    if (keepLabel && t.length && !t.trim()){ lastKept = r; continue; }   // the gap between label and value
    plainRun(r); setRunText(r, value); placed = true;
  }
  if (!placed && runs.length){
    const base = lastKept || runs[runs.length - 1]; const nr = plainRun(base.cloneNode(true));
    els(nr, "b").forEach(b => b.remove()); kids(nr, "tab").forEach(x => x.remove());
    setRunText(nr, (keepLabel && !/\s$/.test(full) ? " " : "") + value); base.parentNode.insertBefore(nr, base.nextSibling);
  }
}
const cellsOf = tr => kids(tr, "tc");
const textParas = tc => els(tc, "p").filter(p => els(p, "t").length);
function fillCell(tc, value, keepLabel){
  const ps = textParas(tc);
  const p = keepLabel ? ps.find(p => textOf(p).includes(":")) : ps[ps.length - 1];
  if (p) fillPara(p, value, keepLabel);
}
async function buildDocx(M, sigPngB64, templateB64 = TEMPLATE_B64){

  const tbl = kids(els(doc, "body")[0], "tbl")[0];

  const V = (ri, ci, v) => fillCell(cellsOf(rows[ri])[ci], v, false);
  els(rows[0], "t").forEach(t => { if (t.textContent === "Show") t.textContent = "Project"; });
  L(0,0,M.project); L(1,0,M.vendorName); L(2,0,M.address);
  L(3,0,M.email); L(3,1,M.phone);

  V(5,0,M.contact); L(5,1,M.invoiceDate);
  L(6,1,M.month); L(7,1,M.department); L(8,1,M.cstart); L(9,1,M.cend); L(10,1,M.reverse);
  V(13,0,M.desc); V(13,1,M.total);
  // day rows sit between the "Date | Total Charge" header (row 14) and the "Total" row
  const isTotal = r => textOf(cellsOf(r)[0]).trim() === "Total";
  let T = rows.findIndex((r, i) => i > 14 && isTotal(r));
  const proto = rows[15], old = rows.slice(15, T);
  M.days.forEach(d => { const nr = proto.cloneNode(true); fillCell(cellsOf(nr)[0], d.date, false); fillCell(cellsOf(nr)[1], d.charge, false); tbl.insertBefore(nr, rows[T]); });
  old.forEach(r => r.remove());
  rows = kids(tbl, "tr"); T = rows.findIndex((r, i) => i > 14 && isTotal(r));
  V(T,1,M.total); V(T+2,1,M.total); L(T+3,0,M.words);
  L(T+5,0,M.pan); L(T+6,0,M.ifsc); L(T+6,1,M.gstNo); L(T+7,0,M.accNo); L(T+7,1,M.hsn); L(T+8,0,M.accName); L(T+8,1,M.place);
  zip.file("word/document.xml", new XMLSerializer().serializeToString(doc));
  const relsPath = "word/_rels/document.xml.rels";
  zip.file(relsPath, (await zip.file(relsPath).async("string")).replace(/Target="mailto:[^"]*"/g, `Target="mailto:${esc(M.email)}"`));
  if (sigPngB64) zip.file("word/media/image1.png", sigPngB64, { base64: true });
  const core = await zip.file("docProps/core.xml").async("string");
  zip.file("docProps/core.xml", core.replace(/<dc:creator>[^<]*<\/dc:creator>/, `<dc:creator>${esc(M.vendorName)}</dc:creator>`).replace(/<cp:lastModifiedBy>[^<]*<\/cp:lastModifiedBy>/, `<cp:lastModifiedBy>${esc(M.vendorName)}</cp:lastModifiedBy>`));

}

/* ===== Fill "My details" from an old invoice (Word or PDF), read on this device ===== */
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
function loadScript(src){ return new Promise((res, rej) => { const t = document.createElement("script"); t.src = src; t.onload = res; t.onerror = rej; document.head.appendChild(t); }); }
async function readDocxInvoice(file){
  const zip = await JSZip.loadAsync(file);

    const b = await zip.file(name).async("base64"); if (b.length > best){ best = b.length; image = `data:image/${/png$/i.test(name) ? "png" : "jpeg"};base64,${b}`; }

async function readPdfInvoice(file){
  if (!window.pdfjsLib){ await loadScript(PDFJS + "pdf.min.js"); window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; }

  const kw = meta && meta.info && meta.info.Keywords || "";
  if (kw.startsWith("invoicinator:")){                     // a PDF made by this tool carries its details
    try { return { direct: JSON.parse(decodeURIComponent(escape(atob(kw.slice(13))))) }; } catch(e){}
  }

  for (let n = 1; n <= pdf.numPages; n++){
    const items = (await (await pdf.getPage(n)).getTextContent()).items.filter(i => i.str && i.str.trim());
    const lines = [];
    items.forEach(i => { const y = i.transform[5]; let line = lines.find(l => Math.abs(l.y - y) < 3); if (!line){ line = { y, items: [] }; lines.push(line); } line.items.push(i); });
    lines.sort((a, b) => b.y - a.y).forEach(l => {
      l.items.sort((a, b) => a.transform[4] - b.transform[4]);
      const cells = []; let cur = null, end = -1e9;
      l.items.forEach(i => { const x = i.transform[4]; if (!cur || x - end > 14){ cur = { x, t: "" }; cells.push(cur); } else if (x - end > 1.5) cur.t += " "; cur.t += i.str; end = x + i.width; });
      const row = cells.map(c => c.t.replace(/\s+/g, " ").trim()).filter(Boolean);

}

  f.address = after(/^address\s*:\s*(.+)$/i);
  if (f.address && !/\d{6}/.test(f.address)){            // a PDF may wrap the address onto the next line
    const ri = rows.findIndex(r => r.some(c => /^address\s*:/i.test(c)));
    for (let k = ri + 1; ri >= 0 && k < Math.min(rows.length, ri + 3); k++){
      const t = rows[k].join(" ");
      if (/^(email|contact|name|pan)\b/i.test(t) || /^[A-Za-z .\/]+:\s/.test(rows[k][0] || "")) break;
      f.address += " " + t; if (/\d{6}/.test(t)) break;
    }
  }
  f.email = (all.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/) || [""])[0];
  f.phone = after(/contact\s*(?:no|number)?\.?\s*:\s*(\+?[\d][\d\s-]{6,})/i).replace(/\s+/g, "");
  f.pan = after(/^pan\s*:?\s*([A-Z]{5}\d{4}[A-Z])/i) || (all.match(/\b[A-Z]{5}\d{4}[A-Z]\b/) || [""])[0];
  f.gstNo = after(/gst[^:]*no\.?\s*:\s*([0-9A-Z]{15})/i) || (all.match(/\b\d{2}[A-Z]{5}\d{4}[A-Z][0-9A-Z]Z[0-9A-Z]\b/) || [""])[0];
  f.hsn = after(/(?:hsn|sac)[^:]*:\s*(\d{4,8})/i);
  f.ifsc = after(/(?:neft|ifsc)[^:]*:\s*([A-Z]{4}0[A-Z0-9]{6})/i) || (all.match(/\b[A-Z]{4}0[A-Z0-9]{6}\b/) || [""])[0];
  f.accNo = after(/a\/?c\s*(?:number|no)\.?\s*:\s*(\d[\d\s]{5,})/i).replace(/\s+/g, "");
  f.accName = after(/holders?'?\s*name\s*:\s*(.+)$/i);
  f.place = after(/place of [^:]*:\s*(.+)$/i);
  f.department = after(/^department\s*:\s*(.+)$/i);
  f.role = (all.match(/rendered as\s+(.+?)\s+(?:from|on)\s/i) || ["", ""])[1].trim();
  // day rate: the most common charge in the day rows
  const counts = {};
  rows.forEach(r => { if (/^\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4}$/.test(r[0] || "") && r[1]){ const v = (r[1].match(/\d[\d,]*/) || [""])[0].replace(/,/g, ""); if (v) counts[v] = (counts[v] || 0) + 1; } });
  f.dayRate = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0] || "";
  const no = after(/invoice\s*no\.?\s*:\s*(\S+)/i);
  if (no) f.invoiceNo = bumpNo(no);
  Object.keys(f).forEach(k => { if (!f[k]) delete f[k]; });
  return f;
}
const IMPORT_LABELS = { vendorName: "Name", address: "Address", email: "Email", phone: "Contact no.", pan: "PAN", gstNo: "GST reg. no.", hsn: "HSN / SAC",
  place: "Place of supply", ifsc: "IFSC", accNo: "Account no.", accName: "Account holder", department: "Department", role: "Role", dayRate: "Day rate", invoiceNo: "Next invoice no." };
let importFound = null;
async function importInvoice(file){
  const box = $("#importReview"); box.hidden = false; box.innerHTML = `<div class="review">Reading ${esc(file.name)}…</div>`;
  try {
    const isPdf = /\.pdf$/i.test(file.name) || file.type === "application/pdf";
    const raw = isPdf ? await readPdfInvoice(file) : await readDocxInvoice(file);
    const found = raw.direct ? Object.fromEntries(Object.entries(raw.direct).filter(([k, v]) => IMPORT_LABELS[k] && v)) : parseInvoice(raw);
    if (raw.direct && raw.direct.invoiceNo) found.invoiceNo = bumpNo(raw.direct.invoiceNo);
    let sig = null;
    if (raw.image){ try { sig = cleanSignature(await loadImg(raw.image), { stripLine: true }); } catch(e){} }
    if (!Object.keys(found).length && !sig){ box.innerHTML = `<div class="review">Couldn’t find any details in that file.${isPdf ? " If it’s a scan, try the Word version." : ""} <button type="button" class="link" id="rvCancel">Close</button></div>`; $("#rvCancel").onclick = closeImport; return; }
    importFound = { fields: found, sig };
    box.innerHTML = `<div class="review"><h3>Found in ${esc(file.name)}</h3>
      ${Object.entries(found).map(([k, v]) => `<label class="rv"><input type="checkbox" data-f="${k}" checked><span>${IMPORT_LABELS[k]}</span><em>${esc(v)}</em></label>`).join("")}
      ${sig ? `<label class="rv"><input type="checkbox" data-f="__sig" checked><span>Signature</span><em><img src="${sig.src}" alt="Signature"></em></label>` : ""}
      <div class="sigbtns"><button type="button" class="btn2 primary" id="rvUse">Use these</button><button type="button" class="btn2" id="rvCancel">Cancel</button></div></div>`;
    $("#rvCancel").onclick = closeImport;
    $("#rvUse").onclick = () => {
      $$("#importReview [data-f]:checked").forEach(cb => { const k = cb.dataset.f; if (k === "__sig") setUserSig(importFound.sig); else S[k] = importFound.fields[k]; });
      if (S.rateMode !== "custom") S.days.forEach(d => { d.rate = ""; });
      closeImport(); renderDays(); refresh(); toast("Details filled in");
    };
  } catch(err){ console.error(err); box.innerHTML = `<div class="review">Couldn’t read that file. <button type="button" class="link" id="rvCancel">Close</button></div>`; $("#rvCancel").onclick = closeImport; }
}
function closeImport(){ importFound = null; $("#importReview").hidden = true; $("#importReview").innerHTML = ""; $("#importFile").value = ""; }
$("#importFile").onchange = e => { const f = e.target.files && e.target.files[0]; if (f) importInvoice(f); };

/* ===== Rendering ===== */
const ICON = {
  x: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
  bin: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>`
};
function renderDays(){
  const list = $("#dayList");
  $$(".mode button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.rateMode));
  if (!custom()){ list.innerHTML = ""; return; }
  if (!S.days.length){ list.innerHTML = `<div class="daylist"><div class="empty">Pick From and To dates</div></div>`; return; }
  // every date in the range has a row; clearing its rate means that day is not billed
  list.innerHTML = `<div class="daylist"><div class="dayhead"><span>Date</span><span>Rate</span><span>Overtime</span></div>` +
    S.days.map(d => `<div class="dr ${d.off ? "off" : ""} ${isChanged(d) && !d.off ? "changed" : ""}" data-date="${d.date}">
      <span class="dd">${esc(dayLabel(d.date))}<small>${d.off ? "Off" : esc(weekday(d.date))}</small></span>
      <div class="money"><span>₹</span><input class="rate" inputmode="decimal" value="${d.off ? "" : esc(d.rate !== "" ? d.rate : S.dayRate)}" placeholder="Off" aria-label="Rate on ${esc(nice(d.date))}"></div>
      <div class="money"><span>+</span><input class="extra" inputmode="decimal" value="${esc(d.extra)}" placeholder="0" aria-label="Overtime on ${esc(nice(d.date))}"></div>
    </div>`).join("") + `</div><p class="help">Clear a rate to skip that day.</p>`;
}
function syncInputs(){
  $$("[data-k]").forEach(el => {
    const k = el.dataset.k; let v = S[k] ?? "";
    if (k === "month" && S.monthAuto) v = autoMonth();
    if (document.activeElement !== el && el.value !== v) el.value = v;
  });
  $$("[data-auto]").forEach(b => { b.classList.toggle("on", S.monthAuto); b.textContent = S.monthAuto ? "Auto" : "Use auto"; });
}
function missing(){
  const m = [];
  if (!S.vendorName) m.push("name"); if (!S.address) m.push("address"); if (!S.pan) m.push("PAN"); if (!S.gstNo) m.push("GST no.");
  if (!S.ifsc || !S.accNo) m.push("bank details"); if (!sigSource()) m.push("signature");
  return m;
}
/* A long invoice continues on another A4 page, breaking only between rows (like the Word file does). */
const PAGE_BOTTOM = 1104, NEXT_TOP = 66;
function paginate(html){
  const host = $("#measureHost"); host.innerHTML = html;
  const inv = host.firstElementChild, top = inv.getBoundingClientRect().top;
  const end = Math.ceil(inv.querySelector(".bx").getBoundingClientRect().bottom - top);
  const cuts = Array.from(inv.querySelectorAll(".bx > .r, table.dt tr")).map(el => Math.round(el.getBoundingClientRect().bottom - top)).sort((a, b) => a - b);
  host.innerHTML = "";
  const pages = []; let start = 0, winTop = 0;
  for (let guard = 0; guard < 10; guard++){
    const room = PAGE_BOTTOM - winTop;
    if (end - start <= room){ pages.push({ winTop, winH: 1123 - winTop, shift: start }); break; }
    const cut = cuts.filter(c => c > start + 60 && c + 2 <= start + room).pop() || (start + room - 2);
    pages.push({ winTop, winH: cut + 2 - start, shift: start });
    start = cut; winTop = NEXT_TOP;
  }
  return pages;
}
function pagesHTML(html){
  return paginate(html).map(p => `<div class="page"><div class="win" style="top:${p.winTop}px;height:${p.winH}px"><div class="shift" style="top:${-p.shift}px">${html}</div></div></div>`).join("");
}
let previewTimer = null, previewSeq = 0;
function renderPreview(){
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => {
    const seq = ++previewSeq; const sig = await composedSignature(); if (seq !== previewSeq) return;
    const html = pagesHTML(invoiceHTML(model(), sig));
    $$(".paper").forEach(p => p.innerHTML = html); fitPreviews();
  }, 60);
}
function fitPreviews(){
  $$(".paperwrap").forEach(wrap => {
    if (!wrap.offsetWidth) return;
    const sc = wrap.querySelector(".paperscale");
    const pane = wrap.closest(".previewpane");
    let k = Math.min(1, (wrap.clientWidth - 32) / 794);
    if (pane) k = Math.min(k, (window.innerHeight - 190 - 34) / 1123);   // desktop: whole page in view
    const n = Math.max(1, sc.querySelectorAll(".page").length);
    sc.querySelector(".paper").style.transform = `scale(${k})`; sc.style.width = (794 * k) + "px"; sc.style.height = ((1123 * n + 16 * (n - 1)) * k) + "px";
  });
}
function renderView(){
  ["invoice","history","profile"].forEach(v => { $("#view-" + v).hidden = v !== view; });
  $$(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.view === view));
  const m = missing();
  $("#profileDot").hidden = !m.length;
  $("#setupBanner").hidden = !m.length; $("#setupText").textContent = m.length ? `Missing ${m.join(", ")}` : "";
  $("#sum").innerHTML = `${esc(S.showName || "Untitled")} · #${esc(S.invoiceNo || "–")}<b>₹${inr(grandTotal())}</b>`;
}
function refresh(){
  const total = grandTotal(), wd = workedDays(), ot = wd.reduce((s,d) => s + extraOf(d), 0);
  $("#gt").textContent = "₹" + inr(total);
  $("#gw").textContent = total ? rupeesInWords(total) : "";
  $("#gdays").textContent = `${wd.length} day${wd.length === 1 ? "" : "s"}` + (custom() || !wd.length ? "" : ` × ₹${inr(num(S.dayRate))}`) + (ot ? ` · ₹${inr(ot)} overtime` : "");
  syncInputs(); renderView(); renderPreview(); persist();
}

/* ===== Events ===== */
function goView(v){ view = v; if (v === "history") renderHistory(); refresh(); window.scrollTo({ top: 0 }); }
document.addEventListener("click", e => {
  const g = e.target.closest("[data-goto]"); if (g){ e.preventDefault(); goView(g.dataset.goto); return; }
  const nv = e.target.closest(".nav [data-view]"); if (nv){ goView(nv.dataset.view); return; }
  const md = e.target.closest(".mode [data-mode]"); if (md){ S.rateMode = md.dataset.mode; renderDays(); refresh(); return; }
  const au = e.target.closest("[data-auto]"); if (au){ e.preventDefault(); S.monthAuto = true; S.month = ""; refresh(); return; }

});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.k){
    const k = el.dataset.k;
    if (k === "startDate" || k === "endDate") return;
    if (k === "month"){ S.monthAuto = false; S.month = el.value; }
    else S[k] = el.value;
    if (k === "dayRate"){ S.days.forEach(d => { if (num(d.rate) === num(S.dayRate)) d.rate = ""; }); renderDays(); }
    refresh(); return;
  }
  const row = el.closest("#dayList [data-date]");
  if (row){
    const d = S.days.find(x => x.date === row.dataset.date); if (!d) return;
    if (el.classList.contains("rate")){
      d.off = !num(el.value);
      d.rate = d.off || num(el.value) === num(S.dayRate) ? "" : el.value;
      row.querySelector(".dd small").textContent = d.off ? "Off" : weekday(d.date);
    }
    if (el.classList.contains("extra")) d.extra = el.value;
    row.classList.toggle("off", d.off); row.classList.toggle("changed", isChanged(d) && !d.off); refresh();
  }
});
document.addEventListener("change", e => {
  const k = e.target.dataset.k;
  if (k === "startDate" || k === "endDate"){
    S[k] = e.target.value;
    if (S.startDate && S.endDate && S.endDate < S.startDate){ if (k === "startDate") S.endDate = S.startDate; else S.startDate = S.endDate; }
    syncRange(); renderDays(); refresh(); return;
  }
  if (k && e.target.tagName === "SELECT"){ S[k] = e.target.value; refresh(); }
});
$("#pvBtn").onclick = () => { $("#sheet").hidden = false; document.body.style.overflow = "hidden"; fitPreviews(); };
$("#sheetClose").onclick = () => { $("#sheet").hidden = true; document.body.style.overflow = ""; };
let tt; function toast(msg, actionLabel, action){
  const t = $("#toast"); t.textContent = msg;
  if (actionLabel){ const b = document.createElement("button"); b.type = "button"; b.textContent = actionLabel; b.onclick = () => { action(); t.classList.remove("show"); }; t.append(" ", b); }
  t.classList.toggle("act", !!actionLabel); t.classList.add("show"); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove("show"), actionLabel ? 5000 : 2400);
}
window.addEventListener("resize", fitPreviews);

/* ===== History ===== */
function snapshot(){ const d = {}; Object.keys(S).forEach(k => { if (!VENDOR_KEYS.includes(k) || CARRY_KEYS.includes(k)) d[k] = JSON.parse(JSON.stringify(S[k])); }); return d; }
function saveToHistory(){
  const entry = { id: `${S.invoiceNo}|${S.showName}`, savedAt: Date.now(), total: grandTotal(), data: snapshot() };
  history = history.filter(h => h.id !== entry.id); history.unshift(entry); history = history.slice(0, 80);
  store.set(K("history"), history);
}
function renderHistory(){
  const list = $("#histList");
  if (!history.length){ list.innerHTML = `<div class="empty">None yet</div>`; return; }
  list.innerHTML = history.map((h,i) => `<div class="hitem">
      <div class="meta"><b>#${esc(h.data.invoiceNo)} · ${esc(h.data.showName || "Untitled")}</b><span>₹${inr(h.total)} · ${new Date(h.savedAt).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}</span></div>
      <button type="button" class="btn2" data-open="${i}">Open</button>
      <button type="button" class="del" data-rm="${i}" aria-label="Delete">${ICON.x}</button></div>`).join("");
}
$("#histList").addEventListener("click", e => {
  const o = e.target.closest("[data-open]"), r = e.target.closest("[data-rm]");
  if (o){ const data = JSON.parse(JSON.stringify(history[+o.dataset.open].data)); Object.assign(S, freshInvoice(), data); S.days = normaliseDays(S.days, S.dayRate); if (!["same","custom"].includes(S.rateMode)) S.rateMode = "same"; view = "invoice"; renderDays(); refresh(); window.scrollTo(0,0); }
  if (r){ history.splice(+r.dataset.rm, 1); store.set(K("history"), history); renderHistory(); refresh(); }
});
function bumpNo(no){
  const m = String(no || "").match(/^(.*?)(\d+)(\D*)$/);
  if (!m) return no ? no + "-2" : CONFIG.firstInvoiceNo;
  const n = String(parseInt(m[2], 10) + 1).padStart(m[2].length, "0");
  return m[1] + n + m[3];
}
function nextInvoiceNo(){
  // count up from the invoice just finished, keeping its format (7 -> 8, SCP/26/09 -> SCP/26/10)
  const last = S.invoiceNo || (history[0] && history[0].data.invoiceNo);
  return last ? bumpNo(last) : CONFIG.firstInvoiceNo;
}
function newInvoice(){
  if (S.showName || S.days.length) saveToHistory();
  Object.assign(S, freshInvoice(), { invoiceNo: nextInvoiceNo() });
  view = "invoice"; renderDays(); refresh(); toast(`Invoice #${S.invoiceNo}`); window.scrollTo(0,0);
}
$("#newInvBtn").onclick = newInvoice; $("#newInvBtn2").onclick = newInvoice;
$("#resetMe").onclick = () => { Object.assign(S, VENDOR_DEFAULTS); renderDays(); refresh(); };

/* ===== Downloads ===== */
function saveBlob(blob, name){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
async function busy(btn, fn){ btn.disabled = true; const old = btn.textContent; btn.textContent = "…"; try { await fn(); } catch(err){ console.error(err); toast("Something went wrong. Try again."); } finally { btn.disabled = false; btn.textContent = old; } }
async function renderPdfPages(){
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const host = $("#exportHost"); host.innerHTML = pagesHTML(invoiceHTML(model(), await composedSignature()));
  try {
    await Promise.all(Array.from(host.querySelectorAll("img")).map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    const out = [];
    for (const pg of host.querySelectorAll(".page"))
      out.push(await html2canvas(pg, { scale: 2.5, backgroundColor: "#ffffff", logging: false, width: 794, height: 1123, windowWidth: 794, windowHeight: 1123, scrollX: 0, scrollY: 0 }));
    return out;
  } finally { host.innerHTML = ""; }
}
async function downloadPDF(){
  if (!window.html2canvas || !window.jspdf){ toast("Couldn’t load. Check your connection."); return; }
  await busy($("#dlPdf"), async () => {
    const canvases = await renderPdfPages();
    const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4", orientation: "portrait", compress: true });
    const carry = {}; [...VENDOR_KEYS, "invoiceNo"].forEach(k => { if (S[k]) carry[k] = S[k]; });
    pdf.setProperties({ title: fileBase(), author: S.vendorName || "", keywords: "invoicinator:" + btoa(unescape(encodeURIComponent(JSON.stringify(carry)))) });
    canvases.forEach((c, i) => { if (i) pdf.addPage(); pdf.addImage(c.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, 210, 297); });
    pdf.save(fileBase() + ".pdf");
    saveToHistory(); toast("PDF downloaded");
  });
}
async function downloadDOCX(){
  if (!window.JSZip){ toast("Couldn’t load. Check your connection."); return; }
  await busy($("#dlWord"), async () => {
    const zip = await buildDocx(model(), (await composedSignature()).split(",")[1]);
    saveBlob(await zip.generateAsync({ type: "blob", compression: "DEFLATE", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" }), fileBase() + ".docx");
    saveToHistory(); toast("Word file downloaded");
  });
}
$("#dlPdf").onclick = downloadPDF;
$("#dlWord").onclick = downloadDOCX;

/* ===== Boot ===== */
if (!S.vendorName) view = "profile";
renderSigBox(); renderDays(); renderHistory(); refresh();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderPreview);
</script>
